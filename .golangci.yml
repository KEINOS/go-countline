# DO NOT EDIT THIS FILE WITHOUT PERMISSION
version: "2"

run:
  tests: true
  allow-parallel-runners: true
linters:
  default: all
  exclusions:
    paths:
      - .github
  settings:
    varnamelen:
      ignore-decls:
        - t testing.T
        - e error
        - i int
        - j int
        - ii int
        - jj int
        - T any
  disable:
    # Disabled due to wsl deprecation and new wsl_v5
    - wsl
    # Disabled due to testing private function purpose
    - testpackage
    # Disabled due to global variables for package-level settings
    - gochecknoglobals
    - depguard

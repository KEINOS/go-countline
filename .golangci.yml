# DO NOT EDIT THIS FILE WITHOUT PERMISSION
version: "2"

run:
  tests: true
  allow-parallel-runners: true
linters:
  default: all
  disable:
    # Deprecated linters
    - wsl
    - gomodguard
    # Conflict with wsl_v5
    - whitespace
    # == Project policy ==
    - depguard
    - testpackage
  settings:
    paralleltest:
      ignore-missing: false
    varnamelen:
      ignore-names:
        - ok
        - t
        - tt
